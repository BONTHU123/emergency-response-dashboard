<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emergency Response Login</title>
<link rel="stylesheet" href="style.css">
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh}
.login{width:380px;background:#fff;padding:35px;border-radius:15px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
.login h1{text-align:center;margin-top:0}
.login input{width:100%;padding:12px;margin:8px 0;border:1px solid #cbd5e1;border-radius:8px}
.login button{width:100%;padding:12px;margin-top:15px;border:0;border-radius:8px;background:#2864e8;color:#fff;font-weight:bold;cursor:pointer}
#loginError{color:#b91c1c;text-align:center}
</style>
</head>
<body>
<div class="login">
    <h1>🚨 Emergency Response</h1>
    <p>Login to Dashboard</p>
    <form id="loginForm">
        <input id="username" placeholder="Username" required>
        <input id="password" type="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
    <p id="loginError"></p>
    <small>Demo login: admin / admin</small>
</div>
<script src="login.js"></script>
</body>
</html>
