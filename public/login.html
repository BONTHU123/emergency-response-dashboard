<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Emergency Response - Login</title>

    <link rel="stylesheet" href="./login.css">
</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <div class="ambulance">
                🚑
            </div>

            <h1>Emergency<br>Response</h1>

            <p class="subtitle">Dashboard Login</p>

            <form id="loginForm">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        autocomplete="username"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <button type="submit" id="loginButton">
                    🔐 Login
                </button>

            </form>

            <div id="loginMessage"></div>

            <p class="default-login">
                Default: <b>admin</b> / <b>admin123</b>
            </p>

        </div>

    </div>

    <script src="./login.js"></script>

</body>
</html>
